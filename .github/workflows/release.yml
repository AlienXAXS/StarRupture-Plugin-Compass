name: Build and Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and package only: no GitHub release, no Nexus upload'
        type: boolean
        default: false

jobs:
  release:
    permissions:
      contents: write
    uses: AlienXAXS/StarRupture-Plugin-SDK/.github/workflows/plugin-release.yml@v1.23.1
    with:
      plugin_name: Compass_Plugin
      solution_file: Compass_Plugin.sln
      release_title: Compass Plugin
      # Global (v3 API) id of the mod page: GET /v3/games/starrupture/mods/110 -> data.id
      nexus_mod_id: '37074157699182'
      nexus_display_name: Compass
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
